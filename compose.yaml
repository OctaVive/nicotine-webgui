name: nicotine-webgui
services:
  webui:
    image: nicotine-webgui:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${WEBUI_BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-8180}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
