name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
        nicotine: ['3.3.6', '3.3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps nicotine-plus==${{ matrix.nicotine }}
      - run: python -m unittest discover -s tests/bridge -v
      - run: python -m unittest discover -s tests/container -v
      - run: python dev/scripts/contracts.py --check
      - run: python tests/bridge/integration_nicotine.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - run: npm run format:check && npm run build && npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nicotine-webgui:test .
      - run: python3 tests/container/smoke.py nicotine-webgui:test
